# Frontend nginx — deployed as a standalone Coolify application.
# POE_PROXY_UPSTREAM is injected at container start via entrypoint.sh (envsubst).
# It must resolve the backend container on the shared coolify Docker network.
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_EXCHANGE_CLIENT: api
        VITE_POE_PROXY_BASE_URL: /api/poe
    container_name: poe-exchange-frontend
    environment:
      - POE_PROXY_UPSTREAM=http://poe-exchange-proxy:8787
    labels:
      - traefik.enable=true
      - "traefik.http.routers.poe-exchange-frontend.rule=Host(`poe-flip.apps.devgroup.se`)"
      - traefik.http.routers.poe-exchange-frontend.entrypoints=https
      - traefik.http.routers.poe-exchange-frontend.tls=true
      - traefik.http.routers.poe-exchange-frontend.tls.certresolver=letsencrypt
      - traefik.http.services.poe-exchange-frontend.loadbalancer.server.port=80
    restart: unless-stopped
    networks:
      - coolify

networks:
  coolify:
    external: true
